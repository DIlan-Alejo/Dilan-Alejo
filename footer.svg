<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Gracias por pasar">
  <defs>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0"/>
      <stop offset=".25" stop-color="#FF6B4A"/>
      <stop offset=".55" stop-color="#8B7CFF"/>
      <stop offset=".8" stop-color="#35E0A1"/>
      <stop offset="1" stop-color="#35E0A1" stop-opacity="0"/>
      <animate attributeName="x1" values="-.3;0.1;-.3" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x2" values=".9;1.3;.9" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="fsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="138" rx="18" fill="#0E1522" stroke="#1E2A3D"/>
  <ellipse cx="600" cy="150" rx="300" ry="70" fill="#8B7CFF" opacity=".1" filter="url(#fsoft)"/>
  <rect y="1" width="1200" height="2" fill="url(#fl)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="62" font-size="23" font-weight="700" fill="#E8EEF7">Gracias por pasar.</text>
    <text x="600" y="92" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="11.5" letter-spacing="2.4" fill="#5F7189">APRENDIENDO EN PÚBLICO · SANTA CRUZ, BOLIVIA</text>
  </g>
  <g fill="#FF6B4A">
    <circle cx="470" cy="56" r="2.4"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#35E0A1">
    <circle cx="730" cy="56" r="2.4"><animate attributeName="opacity" values=".9;.2;.9" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="120" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="10.5" letter-spacing="1.8" fill="#4B5B70">DILAN ALEJO · 2026</text>
</svg>
