
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Dilan Alejo — Robotics Engineering and Web Development</title>
  <desc id="desc">A dark navy banner with subtle animated violet and cyan gradients, fine grid lines and the name Dilan Alejo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1B"/>
      <stop offset="0.55" stop-color="#10172B"/>
      <stop offset="1" stop-color="#090F20"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".0"/>
      <stop offset=".48" stop-color="#8B5CF6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".0"/>
      <animate attributeName="x1" values="-0.2;0.15;-0.2" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.8;1.2;0.8" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <ellipse cx="930" cy="55" rx="210" ry="100" fill="#7C3AED" opacity=".17" filter="url(#blur)">
    <animate attributeName="cx" values="900;980;900" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1080" cy="280" rx="190" ry="85" fill="#06B6D4" opacity=".13" filter="url(#blur)">
    <animate attributeName="cy" values="270;235;270" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <rect width="1200" height="340" rx="22" fill="url(#glow)"/>

  <g fill="none" stroke-width="1.2" opacity=".42">
    <path d="M790 0V340M826 0V340M862 0V340M898 0V340M934 0V340M970 0V340M1006 0V340M1042 0V340M1078 0V340M1114 0V340" stroke="#64748B" stroke-opacity=".22"/>
    <path d="M760 260L910 110L1050 250L1170 130" stroke="#22D3EE" stroke-opacity=".42"/>
    <circle cx="910" cy="110" r="4" fill="#22D3EE" stroke="none"/>
    <circle cx="1050" cy="250" r="4" fill="#A3E635" stroke="none"/>
    <circle cx="1170" cy="130" r="4" fill="#8B5CF6" stroke="none"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="82" y="92" fill="#A5B4FC" font-size="15" font-weight="600" letter-spacing="4">HELLO, WORLD  /  HOLA, MUNDO</text>
    <text x="78" y="174" fill="#F8FAFC" font-size="64" font-weight="750" letter-spacing="-2">DILAN ALEJO</text>
    <rect x="82" y="198" width="54" height="4" rx="2" fill="#8B5CF6"/>
    <rect x="142" y="198" width="30" height="4" rx="2" fill="#22D3EE"/>
    <text x="82" y="245" fill="#CBD5E1" font-size="21" font-weight="500">Robotics Engineering Student</text>
    <text x="82" y="276" fill="#94A3B8" font-size="17">Self-taught Web Developer  ·  Santa Cruz, Bolivia</text>
  </g>

  <g transform="translate(1050 74)" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="52" stroke="#8B5CF6" stroke-opacity=".32" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="38" stroke="#22D3EE" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
    </circle>
    <path d="M-17 0H17M0-17V17M-12-12L12 12M12-12L-12 12" stroke="#A3E635" stroke-opacity=".8" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="5" fill="#22D3EE" stroke="none"/>
  </g>

  <text x="1110" y="310" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2" text-anchor="end">LEARN  ·  BUILD  ·  REPEAT</text>
</svg>
