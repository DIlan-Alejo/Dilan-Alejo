<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Proyecto cv-vitale">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35E0A1" stop-opacity=".13"/>
      <stop offset=".55" stop-color="#35E0A1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35E0A1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#35E0A1" stop-opacity="0"/>
    </linearGradient>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="598" height="278" rx="18" fill="#0E1522" stroke="#1E2A3D"/>
  <rect x="1" y="1" width="598" height="278" rx="18" fill="url(#wash)"/>
  <ellipse cx="556" cy="18" rx="86" ry="56" fill="#35E0A1" opacity=".16" filter="url(#pglow)">
    <animate attributeName="opacity" values=".10;.22;.10" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <circle cx="26" cy="25" r="3.6" fill="#334155"/>
    <circle cx="40" cy="25" r="3.6" fill="#334155"/>
    <circle cx="54" cy="25" r="3.6" fill="#35E0A1" opacity=".85"/>
    <text x="74" y="29.5" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="13" fill="#8496AC">/projects/cv-vitale</text>
  </g>
  <line x1="1" y1="50" x2="599" y2="50" stroke="#1E2A3D"/>

  <g transform="translate(30 80)">
    <path d="M0 8a6 6 0 0 1 6-6h14l8 9h22a6 6 0 0 1 6 6v6H0z" fill="#35E0A1" opacity=".24"/>
    <path d="M0 16a6 6 0 0 1 6-6h40a6 6 0 0 1 6 6v24a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6z" fill="#35E0A1" opacity=".16" stroke="#35E0A1" stroke-opacity=".65" stroke-width="1.4"/>
    <path d="M13 24h18M13 31h11" stroke="#35E0A1" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".85"/>
  </g>

  <text x="104" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-.6" fill="#E8EEF7">cv-vitale</text>
  <text x="570" y="104" text-anchor="end" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="12.5" letter-spacing="1.8" fill="#35E0A1" opacity=".85">TYPESCRIPT</text>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#B3C1D3">
    <text x="30" y="158">Estudio académico para armar, ordenar y exportar tu CV.</text>
    <text x="30" y="184">Autenticación y datos con Supabase.</text>
  </g>

  <text x="30" y="240" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="14" fill="#35E0A1" opacity=".9">Next.js · Supabase · Tailwind</text>

  <g transform="translate(570 240)" text-anchor="end">
    <text x="-24" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="12" letter-spacing="1.4" fill="#8496AC">ABRIR</text>
    <g>
      <path d="M0 0h11M7-4l4 4-4 4" fill="none" stroke="#35E0A1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="1" y="277" width="0" height="2" rx="1" fill="url(#pbar)">
    <animate attributeName="width" values="0;520;0" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
