<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="bt bd">
  <title id="bt">Dilan Alejo — Ingeniería en Robótica y desarrollo web</title>
  <desc id="bd">Banner oscuro con degradados coral, violeta y menta, un chip de circuito animado y el nombre Dilan Alejo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E15"/>
      <stop offset="0.6" stop-color="#0C1420"/>
      <stop offset="1" stop-color="#080C13"/>
    </linearGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B6C4D8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <ellipse cx="1010" cy="80" rx="240" ry="150" fill="#8B7CFF" opacity=".13" filter="url(#soft)">
    <animate attributeName="opacity" values=".10;.17;.10" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="780" cy="340" rx="260" ry="120" fill="#FF6B4A" opacity=".07" filter="url(#soft)"/>

  <!-- circuito -->
  <g>
    <circle cx="960" cy="190" r="146" fill="none" stroke="#8B7CFF" stroke-opacity=".18" stroke-dasharray="2 9">
      <animateTransform attributeName="transform" type="rotate" from="0 960 190" to="360 960 190" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="190" r="112" fill="none" stroke="#45C6F5" stroke-opacity=".09"/>

    <g fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M886 190 H820 V128 H752" stroke="#45C6F5" stroke-opacity=".42"/>
      <path d="M960 122 V86 H1040" stroke="#35E0A1" stroke-opacity=".38"/>
      <path d="M990 258 V300 H1060" stroke="#FF6B4A" stroke-opacity=".34"/>
      <path d="M1034 220 H1108 V164" stroke="#8B7CFF" stroke-opacity=".42"/>
    </g>

    <g>
      <circle r="2.6" fill="#45C6F5"><animateMotion dur="6.5s" repeatCount="indefinite" path="M886 190 H820 V128 H752"/></circle>
      <circle r="2.6" fill="#35E0A1"><animateMotion dur="8s" repeatCount="indefinite" path="M960 122 V86 H1040"/></circle>
      <circle r="2.6" fill="#FF6B4A"><animateMotion dur="7.5s" repeatCount="indefinite" path="M990 258 V300 H1060"/></circle>
      <circle r="2.6" fill="#8B7CFF"><animateMotion dur="9s" repeatCount="indefinite" path="M1034 220 H1108 V164"/></circle>
    </g>

    <g>
      <circle cx="752" cy="128" r="3.6" fill="#45C6F5"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="86" r="3.6" fill="#35E0A1"><animate attributeName="opacity" values="1;.35;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="300" r="3.6" fill="#FF6B4A"><animate attributeName="opacity" values=".4;1;.4" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="1108" cy="164" r="3.6" fill="#8B7CFF"><animate attributeName="opacity" values="1;.4;1" dur="5.4s" repeatCount="indefinite"/></circle>
    </g>

    <g stroke="#8B7CFF" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
      <path d="M886 160 H900 M886 190 H900 M886 220 H900"/>
      <path d="M1020 160 H1034 M1020 190 H1034 M1020 220 H1034"/>
      <path d="M930 136 V122 M960 136 V122 M990 136 V122"/>
      <path d="M930 244 V258 M960 244 V258 M990 244 V258"/>
    </g>
    <rect x="900" y="136" width="120" height="108" rx="14" fill="#0B1220" stroke="#8B7CFF" stroke-opacity=".55"/>
    <rect x="930" y="164" width="60" height="60" rx="9" fill="#8B7CFF" opacity=".1" stroke="#8B7CFF" stroke-opacity=".45"/>
    <path d="M945 179h30M945 194h30M945 209h18" stroke="#35E0A1" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".75"/>
    <circle cx="960" cy="190" r="4.5" fill="#FF6B4A">
      <animate attributeName="opacity" values="1;.4;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="902" y="140" width="116" height="2" rx="1" fill="#45C6F5" opacity=".3">
      <animate attributeName="y" values="140;238;140" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".05;.45;.05" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- texto -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="108" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="12.5" font-weight="700" letter-spacing="3.4" fill="#FF6B4A">INGENIERÍA EN ROBÓTICA · DESARROLLO WEB</text>
    <text x="76" y="196" font-size="78" font-weight="800" letter-spacing="-2.6" fill="url(#nm)">Dilan Alejo</text>
    <g transform="translate(80 222)">
      <rect width="58" height="4" rx="2" fill="#FF6B4A"/>
      <rect x="66" width="34" height="4" rx="2" fill="#8B7CFF"/>
      <rect x="108" width="18" height="4" rx="2" fill="#35E0A1"/>
    </g>
    <text x="80" y="262" font-size="18.5" fill="#C3D0E1">Estudiante de Ingeniería en Robótica</text>
    <text x="80" y="290" font-size="15" fill="#8496AC">Desarrollo web autodidacta · Santa Cruz, Bolivia</text>
  </g>
  <text x="1120" y="322" text-anchor="end" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', monospace" font-size="11.5" letter-spacing="2.2" fill="#5F7189">@DIlan-Alejo</text>
</svg>
